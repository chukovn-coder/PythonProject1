[tool.poetry]
name = "pythonproject1"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]

# Отключаем package-mode
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.19.0"

# Конфигурация black

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"

[tool.black]
line-length = 119
target-version = ["py310"]
exclude = ".git"

# Конфигурация isort
[tool.isort]
line_length = 119
profile = "black"

# Конфигурация mypy
[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"


